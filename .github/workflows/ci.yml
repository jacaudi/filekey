---
name: CI/CD

"on":
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  lint-go:
    name: Lint Go
    uses: jacaudi/github-actions/.github/workflows/lint.yml@v0.20.3
    permissions:
      contents: read
    with:
      go: true
      working-directory: server

  lint-config:
    name: Lint Config
    uses: jacaudi/github-actions/.github/workflows/lint.yml@v0.20.3
    permissions:
      contents: read
    with:
      yaml: true
      yamllint-config: .yamllint.yml
      json: true

  test-go:
    name: Test Go
    uses: jacaudi/github-actions/.github/workflows/test.yml@v0.20.3
    permissions:
      contents: read
    with:
      test-framework: go
      working-directory: server
      go-version: stable
      setup-command: npm --prefix web ci && npm --prefix web run build && cp -r web/dist/. server/dist/
      artifact-name: test-results-go

  test-web:
    name: Test Web
    uses: jacaudi/github-actions/.github/workflows/test.yml@v0.20.3
    permissions:
      contents: read
    with:
      test-framework: custom
      working-directory: web
      # setup-command runs from repo root (not working-directory), so cd into web/
      # where package-lock.json lives; the reusable workflow does no auto npm install
      # for the custom framework.
      setup-command: cd web && npm ci
      test-command: npm test && npm run build && npm run test:dist
      node-version: '22'
      artifact-name: test-results-web

  release:
    name: Release
    needs: [lint-go, lint-config, test-go, test-web]
    uses: jacaudi/github-actions/.github/workflows/semantic-release.yml@v0.20.3
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      use-github-app: true
      allow-initial-development-versions: true
    secrets:
      app-id: ${{ secrets.APP_ID }}
      app-private-key: ${{ secrets.APP_PRIVATE_KEY }}

  docker:
    name: Docker Build
    needs: [release]
    if: needs.release.outputs.new-release-published == 'true'
    uses: jacaudi/github-actions/.github/workflows/docker-build.yml@v0.20.3
    permissions:
      contents: read
      packages: write
    with:
      image-name: ${{ github.repository }}
      platforms: linux/amd64,linux/arm64
      version: ${{ needs.release.outputs.new-release-version }}
      tags: |
        ghcr.io/${{ github.repository }}:${{ needs.release.outputs.new-release-version }}
        ghcr.io/${{ github.repository }}:latest
      build-args: |
        APP_VERSION=${{ needs.release.outputs.new-release-version }}
