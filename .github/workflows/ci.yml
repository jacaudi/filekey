---
name: CI/CD

"on":
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  lint-go:
    name: Lint Go
    uses: jacaudi/github-actions/.github/workflows/lint.yml@v0.13.0
    permissions:
      contents: read
    with:
      go: true
      working-directory: server

  lint-config:
    name: Lint Config
    uses: jacaudi/github-actions/.github/workflows/lint.yml@v0.13.0
    permissions:
      contents: read
    with:
      yaml: true
      yamllint-config: .yamllint.yml
      json: true

  test-node:
    name: Test Node
    uses: jacaudi/github-actions/.github/workflows/test.yml@v0.13.0
    permissions:
      contents: read
    with:
      test-framework: custom
      test-command: node --test app/tests/test-*.js
      node-version: '22'
      artifact-name: test-results-node

  test-go:
    name: Test Go
    uses: jacaudi/github-actions/.github/workflows/test.yml@v0.13.0
    permissions:
      contents: read
    with:
      test-framework: go
      working-directory: server
      go-version: stable
      setup-command: cp -r app server/app
      artifact-name: test-results-go

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build.js
      - run: git diff --exit-code app/index.html

  release:
    name: Release
    needs: [lint-go, lint-config, test-node, test-go, build-check]
    uses: jacaudi/github-actions/.github/workflows/semantic-release.yml@v0.13.0
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      use-github-app: true
      allow-initial-development-versions: true
    secrets:
      app-id: ${{ secrets.APP_ID }}
      app-private-key: ${{ secrets.APP_PRIVATE_KEY }}

  docker:
    name: Docker Build
    needs: [release]
    if: needs.release.outputs.new-release-published == 'true'
    uses: jacaudi/github-actions/.github/workflows/docker-build.yml@v0.13.0
    permissions:
      contents: read
      packages: write
    with:
      image-name: ${{ github.repository }}
      platforms: linux/amd64,linux/arm64
      version: ${{ needs.release.outputs.new-release-version }}
      tags: |
        ghcr.io/${{ github.repository }}:${{ needs.release.outputs.new-release-version }}
        ghcr.io/${{ github.repository }}:latest
      build-args: |
        APP_VERSION=${{ needs.release.outputs.new-release-version }}

  scan:
    name: Image Scan
    needs: [release, docker]
    if: needs.release.outputs.new-release-published == 'true'
    uses: jacaudi/github-actions/.github/workflows/image-scan.yml@v0.13.0
    permissions:
      contents: read
      packages: read
      security-events: write
    with:
      image-ref: ghcr.io/${{ github.repository }}:${{ needs.release.outputs.new-release-version }}
      severity: CRITICAL,HIGH
      exit-code: 0
