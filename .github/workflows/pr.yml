---
name: PR Validation

"on":
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-go:
    name: Lint Go
    uses: jacaudi/github-actions/.github/workflows/lint.yml@v0.13.0
    with:
      go: true
      working-directory: server

  lint-config:
    name: Lint Config
    uses: jacaudi/github-actions/.github/workflows/lint.yml@v0.13.0
    with:
      yaml: true
      yamllint-config: .yamllint.yml
      json: true

  test-node:
    name: Test Node
    uses: jacaudi/github-actions/.github/workflows/test.yml@v0.13.0
    with:
      test-framework: custom
      setup-command: node scripts/build.js
      test-command: node --test app/tests/test-*.js
      node-version: '22'
      artifact-name: test-results-node

  test-go:
    name: Test Go
    uses: jacaudi/github-actions/.github/workflows/test.yml@v0.13.0
    with:
      test-framework: go
      working-directory: server
      go-version: stable
      # node scripts/build.js relies on the Node.js pre-installed on ubuntu-latest (~v20+)
      setup-command: node scripts/build.js && cp -r app server/app
      artifact-name: test-results-go

  test-web:
    name: Test Web
    uses: jacaudi/github-actions/.github/workflows/test.yml@v0.13.0
    with:
      test-framework: custom
      working-directory: web
      # setup-command runs from repo root (not working-directory), so cd into web/
      # where package-lock.json lives; the reusable workflow does no auto npm install
      # for the custom framework.
      setup-command: cd web && npm ci
      test-command: npm test
      node-version: '22'
      artifact-name: test-results-web

  docker:
    name: Docker Build
    needs: [lint-go, lint-config, test-node, test-go, test-web]
    uses: jacaudi/github-actions/.github/workflows/docker-build.yml@v0.13.0
    permissions:
      contents: read
      packages: write
    with:
      image-name: ${{ github.repository }}
      platforms: linux/amd64,linux/arm64
      push: false
