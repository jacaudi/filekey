name: Semantic Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  release:
    uses: jacaudi/github-actions/.github/workflows/semantic-release.yml@v0.13.0
    with:
      use-github-app: true
      allow-initial-development-versions: true
    secrets:
      app-id: ${{ secrets.APP_ID }}
      app-private-key: ${{ secrets.APP_PRIVATE_KEY }}

  docker:
    needs: [release]
    if: needs.release.outputs.new-release-published == 'true'
    uses: jacaudi/github-actions/.github/workflows/docker-build.yml@v0.13.0
    with:
      registry: ghcr.io
      platforms: linux/amd64,linux/arm64
      version: ${{ needs.release.outputs.new-release-version }}
      build-args: |
        APP_VERSION=${{ needs.release.outputs.new-release-version }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
